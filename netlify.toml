# Netlify – statischer Export (next.config.ts: output "export") → ./out
# Redirects: public/_redirects · Formulare: public/__forms.html · Details: DEPLOY.md
# Header synchron halten mit vercel.json.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_FORM_ENDPOINT / NEXT_PUBLIC_NEWSLETTER_ENDPOINT im Netlify-UI setzen
  # (Site configuration → Environment variables), siehe .env.example.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self), browsing-topics=()"

# Gehashte Build-Assets (JS, CSS, Schriften): unveränderlich
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimierte Fotos (feste Dateinamen, daher ohne "immutable")
[[headers]]
  for = "/images/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
